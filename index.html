<style>

    --primary-mid: #3a6cb0;
    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #22303f;
    --text-soft: #5b6b7c;
    --border: #dde6f0;

  .counter {
    display: flex; align-items: center; gap: 7px;

    border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px;
    padding: 5px 13px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    transition: background .15s, transform .1s;
    color: #fff;

  .counter:hover { background: rgba(255,255,255,.22); }
  .counter.active { background: #fff; color: var(--primary-dark); font-weight: 600; }
  .counter .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .counter .num { font-weight: 700; }

  .tabs {
    max-width: 1100px;
    margin: 18px auto 0;
    padding: 0 16px;
    display: flex;
    gap: 6px;

    border: none;

    font-family: inherit;
    color: var(--text-soft);
    cursor: pointer;

  .panel.active { display: block; }

    font-size: 13.5px;

    .doc-content { padding: 16px; }
    .tab-btn { padding: 8px 10px; font-size: 13.5px; }
  }
</style>

  const lines = String(md).replace(/\r\n/g, "\n").split("\n");
  let html = "", inCode = false, codeBuf = [], listBuf = [], listTag = null;

  function flushList() {
    if (listBuf.length) {
      html += "<" + listTag + ">" + listBuf.map(li => "<li>" + li + "</li>").join("") + "</" + listTag + ">";
      listBuf = []; listTag = null;
    }
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const trimmed = line.trim();

    if (trimmed.startsWith("```")) {
      if (inCode) { html += "<pre><code>" + codeBuf.map(escapeHtml).join("\n") + "</code></pre>"; codeBuf = []; }
      else { flushList(); }
      inCode = !inCode;
      continue;
    }
    if (inCode) { codeBuf.push(line); continue; }

    if (trimmed === "") { flushList(); continue; }
    if (/^---+$/.test(trimmed)) { flushList(); html += "<hr>"; continue; }

    const h = trimmed.match(/^(#{1,3})\s+(.*)$/);
    if (h) { flushList(); const lvl = h[1].length; html += "<h" + lvl + ">" + mdInline(escapeHtml(h[2])) + "</h" + lvl + ">"; continue; }

    if (trimmed.startsWith("> ")) { flushList(); html += "<blockquote>" + mdInline(escapeHtml(trimmed.slice(2))) + "</blockquote>"; continue; }

    const ul = trimmed.match(/^[-*]\s+(.*)$/);
    if (ul) { if (listTag !== "ul") flushList(); listTag = "ul"; listBuf.push(mdInline(escapeHtml(ul[1]))); continue; }

    const ol = trimmed.match(/^\d+[.)]\s+(.*)$/);
    if (ol) { if (listTag !== "ol") flushList(); listTag = "ol"; listBuf.push(mdInline(escapeHtml(ol[1]))); continue; }

    flushList();
    html += "<p>" + mdInline(escapeHtml(trimmed)) + "</p>";
  }
  if (inCode && codeBuf.length) html += "<pre><code>" + codeBuf.map(escapeHtml).join("\n") + "</code></pre>";
  flushList();
  return html;
}

/* ================= Organizasyon Dosyaları ================= */
function renderDocList() {
  const list = document.getElementById("docList");
  list.innerHTML = DATA.docs.map((d, i) =>
    '<div class="doc-card" data-idx="' + i + '" role="button" tabindex="0">' +
      '<span class="doc-emoji">' + escapeHtml(d.emoji) + '</span>' +
      '<span class="doc-title">' + escapeHtml(d.title) + '</span>' +
    '</div>'
  ).join("");
  list.querySelectorAll(".doc-card").forEach(card => {
    card.addEventListener("click", () => openDoc(+card.dataset.idx));
    card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDoc(+card.dataset.idx); } });
  });
}

function openDoc(idx) {
  const doc = DATA.docs[idx];
  if (!doc) return;
  document.getElementById("docList").style.display = "none";
  const view = document.getElementById("docView");
  view.classList.add("visible");
  document.getElementById("docContent").innerHTML = mdToHtml(doc.content);
  view.scrollIntoView({ behavior: "smooth", block: "start" });
}

function closeDoc() {
  document.getElementById("docView").classList.remove("visible");
  document.getElementById("docList").style.display = "";
}

/* ================= Sekmeler ================= */
function switchTab(tabId) {
  document.querySelectorAll(".tab-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === tabId));
  document.querySelectorAll(".panel").forEach(p =>
    p.classList.toggle("active", p.id === "panel-" + tabId));
}

/* ================= Başlatma ================= */
function renderAll() {
  document.getElementById("updatedAt").textContent = DATA.updated;
  renderCounters();
  renderFilterNote();
  renderTeams();
  renderActivity();
  renderDocList();
}

document.getElementById("tabs").addEventListener("click", e => {
  const btn = e.target.closest(".tab-btn");
  if (btn) switchTab(btn.dataset.tab);
});
document.getElementById("clearFilterBtn").addEventListener("click", () => { activeFilter = null; renderAll(); });
document.getElementById("docBackBtn").addEventListener("click", closeDoc);

renderAll();
</script>
